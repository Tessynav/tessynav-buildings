name: Build building tiles

on:
  schedule:
    - cron: '0 6 3 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          pip install overturemaps shapely pyarrow osmium
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - name: Download Overture buildings
        run: python3 buildings.py download
      - name: OpenStreetMap heights (where Overture has none)
        run: |
          mkdir -p data
          curl -sSL -o data/quebec.osm.pbf https://download.geofabrik.de/north-america/canada/quebec-latest.osm.pbf
          osmium tags-filter data/quebec.osm.pbf w/height w/building:levels r/height r/building:levels -o data/osm-heights.osm.pbf --overwrite
          rm data/quebec.osm.pbf
          python3 buildings.py osm data/osm-heights.osm.pbf
      - name: Build building tiles
        run: python3 buildings.py build
      - name: Record the build (a small note in the repository, so GitHub never pauses the monthly schedule)
        run: |
          date -u +"%Y-%m-%dT%H:%MZ" > last-build.txt
          git config user.name "tessynav-bot"
          git config user.email "tessynav-bot@users.noreply.github.com"
          git add last-build.txt
          git commit -q -m "Building tiles built $(date -u +%F)" || exit 0
          git push -q
      - name: Free space
        run: rm -rf data && du -sh out
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 2400000   # (40 minutes: tens of thousands of tile files take longer than the default 10 to publish)
